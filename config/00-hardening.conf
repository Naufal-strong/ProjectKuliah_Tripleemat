# =============================================================================
# Tripleemat Security Assessor — System & SSH Hardening Configuration
# File: config/00-hardening.conf
# Target: Ubuntu/Debian Linux VM (SSH & Kernel Hardening)
# Standar: CIS Benchmark Level 1 / Lynis Hardening Guidelines
# Milestone: sec-0.2 (Sub-CPMK 3)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Konfigurasi Pengerasan Layanan SSH (sshd)
# Lokasi implementasi sistem: /etc/ssh/sshd_config.d/00-hardening.conf
# -----------------------------------------------------------------------------

# Larang otentikasi kata sandi (Wajib menggunakan SSH Key Ed25519 / RSA 4096)
PasswordAuthentication no
KbdInteractiveAuthentication no

# Nonaktifkan login langsung akun root (Prinsip Least Privilege)
PermitRootLogin no

# Aktifkan otentikasi berbasis kunci publik
PubkeyAuthentication yes

# Batasi percobaan otentikasi untuk memitigasi brute-force
MaxAuthTries 3

# Batasi forwardings yang tidak diperlukan
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# Sesi idle timeout (putus koneksi setelah 10 menit tidak aktif)
ClientAliveInterval 300
ClientAliveCountMax 2

# Abaikan berkas .rhosts dan berkas lingkungan tidak terpercaya
IgnoreRhosts yes
PermitUserEnvironment no

# Batasi algoritma cipher & MAC hanya ke primitif modern tahan serangan
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# -----------------------------------------------------------------------------
# 2. Konfigurasi Pengerasan Kernel Jaringan & Filesystem (sysctl)
# Lokasi implementasi sistem: /etc/sysctl.d/99-tripleemat-hardening.conf
# -----------------------------------------------------------------------------

# Proteksi SYN Flood Attack (TCP SYN Cookies)
net.ipv4.tcp_syncookies = 1

# Proteksi IP Spoofing (Reverse Path Filtering)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Larang ICMP Redirect Acceptance (Mencegah manipulasi tabel routing)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Larang Source Routed Packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Abaikan ICMP Broadcast Echo Request (Mitigasi Smurf Attack)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Catat paket dengan alamat sumber yang mencurigakan (Martian Packet Logging)
net.ipv4.conf.all.log_martians = 1

# Proteksi Symlink & Hardlink Time-of-Check Time-of-Use (TOCTOU)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Full ASLR (Address Space Layout Randomization)
kernel.randomize_va_space = 2

# Batasi akses buffer dmesg hanya untuk pengguna dengan CAP_SYSLOG
kernel.dmesg_restrict = 1

# Nonaktifkan core dump untuk biner setuid guna mencegah kebocoran memori
fs.suid_dumpable = 0

